<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporizador - Coding Angola</title>
    <link rel="stylesheet" href="./css/style.css">
    
</head>
<body>

    <div class="timer-container">
        <h1><span>{</span> Temporizador Coding Angola <span>}</span></h1>
                
        <div class="display" id="time-display">00:00:00</div>
        
        <div class="buttons-container">
            <button class="btn-start" onclick="iniciar()">Iniciar</button>
            <button class="btn-pause" onclick="pausar()">Pausar</button>
            <button class="btn-reset" onclick="reiniciar()">Reiniciar</button>
        </div>
    </div>

    
</body>
<script src="./js/main.js"></script>
</html>
